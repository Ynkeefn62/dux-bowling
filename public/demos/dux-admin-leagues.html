  :root{--navy:#0D1120;--panel:#131A30;--panel2:#0F1526;--line:#232A44;--cream:#EFE2C4;--dim:#8A93B8;--orange:#F5823E;--hot:#FF8A50;--ok:#7ED17E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--cream);font-family:'Dux Stripe Solid',ui-sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:18px 12px 48px}
  header{display:flex;align-items:center;gap:14px;padding:4px 2px 16px}
  header svg.mark{height:28px;width:auto}
  .apptitle{font-size:13px;letter-spacing:.18em;color:var(--dim)}
  .apptitle b{display:block;color:var(--cream);font-weight:400;font-size:15px;letter-spacing:.1em;margin-top:2px}
  .userchip{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.14em;text-align:right;line-height:1.6}
  h2.pg{font-family:'Dux Stripe',sans-serif;font-size:clamp(28px,6vw,36px);color:var(--orange);line-height:1;margin:8px 0 16px}
  .row{display:flex;gap:10px;align-items:center}
  .card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;margin-bottom:12px}
  .card.click{cursor:pointer}
  .card.click:active{background:#161e38}
  .cardtop{display:flex;align-items:baseline;gap:10px}
  .cname{font-size:16px;letter-spacing:.08em;flex:1}
  .chip{font-size:9px;letter-spacing:.16em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .chip.active{color:var(--ok);border-color:#2E5B3A}
  .chip.reg{color:var(--orange);border-color:#6B3A1E}
  .cmeta{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-top:8px;line-height:1.7}
  .newbtn{width:100%;font-family:'Dux Stripe Solid';font-size:13px;letter-spacing:.16em;color:var(--orange);
     background:var(--panel);border:1px dashed #6B3A1E;border-radius:16px;padding:16px;cursor:pointer;margin-top:2px}
  .newbtn:active{background:#171223}
  label{display:block;color:var(--dim);font-size:10px;letter-spacing:.2em;margin:14px 0 6px}
  input,select{width:100%;font-family:'Dux Stripe Solid';font-size:15px;letter-spacing:.06em;color:var(--cream);
     background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  input:focus,select:focus{border-color:#6B3A1E}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg div{flex:1;text-align:center;padding:12px 6px;font-size:12px;letter-spacing:.12em;color:var(--dim);cursor:pointer}
  .seg div.on{background:#1A1426;color:var(--orange)}
  .toggle{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer}
  .tgbox{width:40px;height:22px;border-radius:999px;border:1px solid var(--line);position:relative;flex:none;background:var(--panel2)}
  .tgbox::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:all .15s}
  .toggle.on .tgbox{border-color:#6B3A1E;background:#1A1426}
  .toggle.on .tgbox::after{left:20px;background:var(--orange)}
  .toggle span{font-size:12px;letter-spacing:.1em}
  .calc{border:1px dashed var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;margin-top:12px;
        color:var(--dim);font-size:12px;line-height:1.8;letter-spacing:.06em}
  .calc b{color:var(--orange);font-weight:400}
  .calc .big{font-family:'Dux Stripe',sans-serif;font-size:28px;color:var(--cream);letter-spacing:.02em;line-height:1.2;display:block;margin-top:4px}
  .warn{color:var(--hot)}
  .actions{display:flex;gap:10px;margin-top:20px}
  button{font-family:'Dux Stripe Solid';font-size:13px;letter-spacing:.14em;color:var(--cream);background:var(--panel);
     border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer}
  button:active{background:#1A2240}
  button.primary{color:#1A0F06;background:var(--orange);border-color:var(--orange);flex:1}
  button.primary:active{background:var(--hot)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--dim);font-size:9px;letter-spacing:.16em;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:400}
  td{padding:8px 6px;border-bottom:1px solid var(--line);letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .stat{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px;text-align:center}
  .stat .v{font-family:'Dux Stripe',sans-serif;font-size:28px;color:var(--orange);line-height:1}
  .stat .l{color:var(--dim);font-size:8.5px;letter-spacing:.18em;margin-top:6px}
  .sect{font-size:10px;letter-spacing:.24em;color:var(--dim);margin:20px 0 8px}
  .wkrow{display:flex;gap:5px;flex-wrap:wrap}
  .wk{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:10px;color:var(--dim)}
  .wk.done{background:#1A2240;color:var(--cream)}
  .wk.cur{border-color:#6B3A1E;color:var(--orange);background:#1A1426}
  .back{color:var(--dim);font-size:11px;letter-spacing:.16em;cursor:pointer;margin-bottom:10px;display:inline-block}
  .regbox{border:1px solid #6B3A1E;border-radius:14px;background:#171223;padding:16px;margin-bottom:12px}
  .bar{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin-top:10px;overflow:hidden}
  .bar div{height:100%;background:var(--orange)}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 341 134" aria-label="Dux">
      <defs>
        <g id="dux"><path d="M15 15 V105"/><path d="M15 15 H45 A45 45 0 0 1 45 105 H15"/><path d="M145 15 V75 A30 32 0 0 0 205 75 V15"/><path d="M254 15 L314 105"/><path d="M314 15 L254 105"/></g>
        <mask id="cut"><g transform="translate(6 6)" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#dux" stroke="#fff" stroke-width="30"/><use href="#dux" stroke="#000" stroke-width="9"/></g></mask>
      </defs>
      <rect width="341" height="134" fill="#F5823E" mask="url(#cut)"/>
    </svg>
    <div class="apptitle">OPERATOR ADMIN<b>LEAGUES &amp; TOURNAMENTS</b></div>
    <div class="userchip">WALKERSVILLE LANES<br>ANDREW · OWNER</div>
  </header>

  <div id="view-dash">
    <h2 class="pg">YOUR PROGRAMS</h2>
    <div id="proglist"></div>
    <button class="newbtn" onclick="openCreate()">+ CREATE LEAGUE OR TOURNAMENT</button>
  </div>

  <div id="view-create" class="hidden">
    <span class="back" onclick="show('dash')">&larr; BACK</span>
    <h2 class="pg">NEW PROGRAM</h2>

    <label>TYPE</label>
    <div class="seg" id="typeSeg">
      <div class="on" onclick="setType('league')">LEAGUE</div>
      <div onclick="setType('tournament')">TOURNAMENT</div>
    </div>

    <label>NAME</label>
    <input id="f_name" placeholder="THURSDAY NIGHT CLASSIC">

    <div class="grid2">
      <div><label>START DATE</label><input id="f_date" type="date" value="2026-09-10"></div>
      <div><label>LANES USED</label><input id="f_lanes" type="number" value="8" min="1" max="24"></div>
    </div>

    <div class="sect">FORMAT</div>
    <div class="grid3">
      <div><label>BOWLERS / TEAM</label><input id="f_bpt" type="number" value="4" min="1" max="5" oninput="calc()"></div>
      <div><label id="l_teams">TEAMS</label><input id="f_teams" type="number" value="8" min="2" max="64" oninput="calc()"></div>
      <div><label>GAMES / MATCH</label><input id="f_gpm" type="number" value="3" min="1" max="5" oninput="calc()"></div>
    </div>
    <div class="grid2" id="leagueFmt">
      <div><label>WEEKS (MATCHES / SEASON)</label><input id="f_weeks" type="number" value="30" min="4" max="52" oninput="calc()"></div>
      <div><label>POINTS SYSTEM</label>
        <select id="f_pts">
          <option>2 PER GAME + 2 SERIES</option>
          <option>1 PER GAME + 1 SERIES</option>
          <option>TOTAL PINFALL</option>
        </select>
      </div>
    </div>
    <div class="grid2 hidden" id="tourneyFmt">
      <div><label>QUALIFYING GAMES</label><input id="f_qual" type="number" value="4" min="1" max="8"></div>
      <div><label>FINALS FORMAT</label>
        <select id="f_finals">
          <option>STEPLADDER - TOP 4</option>
          <option>BRACKET - TOP 8</option>
          <option>TOTAL PINFALL</option>
        </select>
      </div>
    </div>

    <div class="sect">HANDICAP</div>
    <div class="toggle on" id="hcToggle" onclick="toggleHC()">
      <div class="tgbox"></div><span id="hcLabel">HANDICAP LEAGUE</span>
    </div>
    <div class="grid2" id="hcFields">
      <div><label>PERCENTAGE</label><input id="f_hcp" type="number" value="80" min="50" max="100" step="5" oninput="calc()"></div>
      <div><label>BASIS SCORE</label><input id="f_hcb" type="number" value="140" min="100" max="200" step="5" oninput="calc()"></div>
    </div>
    <div class="calc" id="hcCalc"></div>

    <div class="sect">MONEY</div>
    <div class="grid3">
      <div><label id="l_fee">FEE / BOWLER / WEEK</label><input id="f_fee" type="number" value="16" min="0" oninput="calc()"></div>
      <div><label>TO PRIZE FUND %</label><input id="f_split" type="number" value="45" min="0" max="100" oninput="calc()"></div>
      <div><label>PAYOUT PLACES</label><input id="f_places" type="number" value="3" min="1" max="6" oninput="buildPayout()"></div>
    </div>
    <div id="payoutRows"></div>
    <div class="calc" id="poolCalc"></div>

    <div class="actions">
      <button onclick="show('dash')">CANCEL</button>
      <button class="primary" onclick="createProg()">CREATE PROGRAM</button>
    </div>
  </div>

  <div id="view-manage" class="hidden"></div>
</main>
<script>
const fmtMoney = n => '$' + Math.round(n).toLocaleString();
let ctype = 'league';
const DEFAULT_PAYOUT = {3:[50,30,20],4:[40,27,20,13],5:[36,25,18,13,8],6:[32,23,17,13,9,6],2:[65,35],1:[100]};

const STORE = [
 {id:1,type:'league',name:'THURSDAY NIGHT CLASSIC',status:'ACTIVE',date:'2026-09-10',lanes:8,
  bpt:4,teams:8,gpm:3,weeks:30,curWeek:8,pts:'2 PER GAME + 2 SERIES',hc:true,hcp:80,hcb:140,
  fee:16,split:45,payout:[50,30,20],
  standings:[["SPLIT HAPPENS",19,5,58],["LUCKY DUX",17,7,54],["PIN PALS",15,9,47],["THE TURKEYS",13,11,42],
             ["DEAD WOOD",11,13,38],["ALLEY OOPS",9,15,31],["GUTTER GANG",8,16,28],["TEN IN THE PIT",4,20,18]],
  roster:[["M. REYES",118],["T. OKAFOR",112],["ANDREW",109],["J. NGUYEN",104],["D. FALCONE",97],["S. WHITT",91]]},
 {id:2,type:'tournament',name:'DUX OPEN - SINGLES',status:'REGISTRATION',date:'2026-11-14',lanes:12,
  bpt:1,teams:32,entered:18,gpm:1,qual:4,finals:'STEPLADDER - TOP 4',pts:'',hc:true,hcp:90,hcb:150,
  fee:40,split:70,payout:[40,25,15,10,6,4]},
];
let nextId = 3;

function show(v){
  ['dash','create','manage'].forEach(x =>
    document.getElementById('view-'+x).classList.toggle('hidden', x!==v));
  window.scrollTo(0,0);
}
function renderDash(){
  document.getElementById('proglist').innerHTML = STORE.map(p => {
    const meta = p.type==='league'
      ? `${p.teams} TEAMS x ${p.bpt} · ${p.gpm} GAMES/MATCH · ${p.weeks} WEEKS` +
        (p.status==='ACTIVE' ? ` · WEEK ${p.curWeek} OF ${p.weeks}` : '') +
        `<br>${p.hc ? p.hcp+'% OF '+p.hcb+' HANDICAP' : 'SCRATCH'} · ${fmtMoney(p.fee)}/BOWLER/WK`
      : `${p.entered||0} OF ${p.teams} ENTRIES · ${p.qual} QUALIFYING GAMES · ${p.finals}` +
        `<br>${p.hc ? p.hcp+'% OF '+p.hcb+' HANDICAP' : 'SCRATCH'} · ${fmtMoney(p.fee)} ENTRY`;
    return `<div class="card click" onclick="openManage(${p.id})">
      <div class="cardtop"><div class="cname">${p.name}</div>
      <div class="chip ${p.status==='ACTIVE'?'active':'reg'}">${p.status}</div>
      <div class="chip">${p.type.toUpperCase()}</div></div>
      <div class="cmeta">${meta}</div></div>`;
  }).join('');
}
function openCreate(){ setType('league'); buildPayout(); calc(); show('create'); }
function setType(t){
  ctype = t;
  document.querySelectorAll('#typeSeg div').forEach((d,i)=>d.classList.toggle('on', (i===0)===(t==='league')));
  document.getElementById('leagueFmt').classList.toggle('hidden', t!=='league');
  document.getElementById('tourneyFmt').classList.toggle('hidden', t==='league');
  document.getElementById('l_teams').textContent = t==='league' ? 'TEAMS' : 'MAX ENTRIES';
  document.getElementById('l_fee').textContent = t==='league' ? 'FEE / BOWLER / WEEK' : 'ENTRY FEE / BOWLER';
  document.getElementById('hcLabel').textContent = t==='league' ? 'HANDICAP LEAGUE' : 'HANDICAP EVENT';
  if (t==='tournament'){ document.getElementById('f_bpt').value = 1; document.getElementById('f_teams').value = 32; }
  else { document.getElementById('f_bpt').value = 4; document.getElementById('f_teams').value = 8; }
  calc();
}
function toggleHC(){
  const t = document.getElementById('hcToggle');
  t.classList.toggle('on');
  document.getElementById('hcFields').classList.toggle('hidden', !t.classList.contains('on'));
  calc();
}
function buildPayout(){
  const n = Math.max(1, Math.min(6, +document.getElementById('f_places').value || 3));
  const def = DEFAULT_PAYOUT[n];
  document.getElementById('payoutRows').innerHTML =
    `<div class="grid3" style="margin-top:10px">` + def.map((v,k)=>
    `<div><label>${k+1}${['ST','ND','RD'][k]||'TH'} PLACE %</label>
     <input id="po${k}" type="number" value="${v}" min="0" max="100" oninput="calc()"></div>`).join('') + `</div>`;
  calc();
}
function payoutVals(){
  const out=[]; let k=0;
  while(document.getElementById('po'+k)){ out.push(+document.getElementById('po'+k).value||0); k++; }
  return out;
}
function calc(){
  const hcOn = document.getElementById('hcToggle').classList.contains('on');
  const pct = +document.getElementById('f_hcp').value||80, basis = +document.getElementById('f_hcb').value||140;
  document.getElementById('hcCalc').innerHTML = hcOn
    ? `HANDICAP = <b>${pct}%</b> OF (<b>${basis}</b> − AVERAGE), PER GAME<br>
       EXAMPLE: A 105-AVERAGE BOWLER RECEIVES <span class="big">+${Math.max(0,Math.round(pct/100*(basis-105)))} PINS / GAME</span>
       A 125 AVERAGE RECEIVES +${Math.max(0,Math.round(pct/100*(basis-125)))} · A ${basis}+ AVERAGE BOWLS SCRATCH`
    : `SCRATCH ${ctype==='league'?'LEAGUE':'EVENT'} - NO PINS ADDED. TOTALS ARE RAW PINFALL.`;
  const bpt=+document.getElementById('f_bpt').value||1, teams=+document.getElementById('f_teams').value||0,
        fee=+document.getElementById('f_fee').value||0, split=+document.getElementById('f_split').value||0,
        weeks=+document.getElementById('f_weeks').value||1;
  const bowlers = bpt*teams;
  const pool = ctype==='league' ? bowlers*fee*(split/100)*weeks : bowlers*fee*(split/100);
  const po = payoutVals(); const sum = po.reduce((a,b)=>a+b,0);
  const rows = po.map((v,k)=>`${k+1}${['ST','ND','RD'][k]||'TH'}: <b>${fmtMoney(pool*v/100)}</b>`).join(' &nbsp;·&nbsp; ');
  document.getElementById('poolCalc').innerHTML =
    `${bowlers} BOWLERS x ${fmtMoney(fee)}${ctype==='league' ? ' x '+weeks+' WEEKS' : ''} x ${split}% TO PRIZES
     <span class="big">${fmtMoney(pool)} PRIZE POOL</span>${rows}<br>` +
    (sum===100 ? `PAYOUT TOTAL: 100%` : `<span class="warn">PAYOUT TOTAL: ${sum}% - MUST EQUAL 100%</span>`);
}
function createProg(){
  const name = (document.getElementById('f_name').value||'UNTITLED PROGRAM').toUpperCase();
  const po = payoutVals();
  if (po.reduce((a,b)=>a+b,0)!==100){ calc(); return; }
  const p = {id:nextId++, type:ctype, name, status:'REGISTRATION',
    date:document.getElementById('f_date').value, lanes:+document.getElementById('f_lanes').value,
    bpt:+document.getElementById('f_bpt').value, teams:+document.getElementById('f_teams').value,
    gpm:+document.getElementById('f_gpm').value, weeks:+document.getElementById('f_weeks').value,
    qual:+document.getElementById('f_qual').value, finals:document.getElementById('f_finals').value,
    pts:document.getElementById('f_pts').value, entered:0, curWeek:0,
    hc:document.getElementById('hcToggle').classList.contains('on'),
    hcp:+document.getElementById('f_hcp').value, hcb:+document.getElementById('f_hcb').value,
    fee:+document.getElementById('f_fee').value, split:+document.getElementById('f_split').value, payout:po};
  STORE.unshift(p); renderDash(); openManage(p.id);
}
function openManage(id){
  const p = STORE.find(x=>x.id===id);
  const bowlers = p.bpt*p.teams;
  const pool = p.type==='league' ? bowlers*p.fee*(p.split/100)*p.weeks : bowlers*p.fee*(p.split/100);
  const collected = p.type==='league' ? bowlers*p.fee*(p.curWeek||0)
                    : (p.entered||0)*p.fee;
  let body = `<span class="back" onclick="show('dash')">&larr; ALL PROGRAMS</span>
    <h2 class="pg">${p.name}</h2>
    <div class="row" style="margin-bottom:12px">
      <div class="chip ${p.status==='ACTIVE'?'active':'reg'}">${p.status}</div>
      <div class="chip">${p.type.toUpperCase()}</div>
      <div class="chip">${p.hc ? p.hcp+'% / '+p.hcb : 'SCRATCH'}</div>
      <div class="chip">STARTS ${p.date}</div>
    </div>
    <div class="row">
      <div class="stat"><div class="v">${p.type==='league'?p.teams:(p.entered||0)+'/'+p.teams}</div><div class="l">${p.type==='league'?'TEAMS':'ENTRIES'}</div></div>
      <div class="stat"><div class="v">${p.type==='league'?(p.curWeek||0)+'/'+p.weeks:p.qual}</div><div class="l">${p.type==='league'?'WEEKS':'QUAL GAMES'}</div></div>
      <div class="stat"><div class="v">${fmtMoney(pool)}</div><div class="l">PRIZE POOL</div></div>
    </div>`;
  if (p.status==='REGISTRATION'){
    const cur = p.type==='league' ? 0 : (p.entered||0), max = p.teams;
    body += `<div class="regbox" style="margin-top:12px">
      <div style="font-size:12px;letter-spacing:.12em">REGISTRATION OPEN - ${cur} OF ${max} ${p.type==='league'?'TEAMS':'ENTRIES'}</div>
      <div class="bar"><div style="width:${Math.round(100*cur/max)}%"></div></div>
      <div class="cmeta" style="margin-top:10px">${p.type==='league'
        ? `${p.bpt} BOWLERS/TEAM · ${p.gpm} GAMES/MATCH · ${p.pts} · ${fmtMoney(p.fee)}/BOWLER/WEEK`
        : `${p.qual} QUALIFYING GAMES · ${p.finals} · ${fmtMoney(p.fee)} ENTRY`}</div>
    </div>`;
  }
  if (p.standings){
    body += `<div class="sect">STANDINGS - WEEK ${p.curWeek}</div><div class="card"><table>
      <tr><th>TEAM</th><th class="r">W</th><th class="r">L</th><th class="r">PTS</th></tr>` +
      p.standings.map((t,k)=>`<tr><td>${k+1}. ${t[0]}</td><td class="r">${t[1]}</td><td class="r">${t[2]}</td><td class="r">${t[3]}</td></tr>`).join('') +
      `</table></div>`;
    body += `<div class="sect">SCHEDULE</div><div class="card"><div class="wkrow">` +
      Array.from({length:p.weeks},(_,k)=>`<div class="wk ${k+1<p.curWeek?'done':k+1===p.curWeek?'cur':''}">${k+1}</div>`).join('') +
      `</div></div>`;
  }
  if (p.roster){
    body += `<div class="sect">SAMPLE ROSTER &amp; HANDICAPS</div><div class="card"><table>
      <tr><th>BOWLER</th><th class="r">AVG</th><th class="r">HDCP/GAME</th><th class="r">W/ HDCP</th></tr>` +
      p.roster.map(r=>{
        const h = p.hc ? Math.max(0, Math.round(p.hcp/100*(p.hcb-r[1]))) : 0;
        return `<tr><td>${r[0]}</td><td class="r">${r[1]}</td><td class="r">+${h}</td><td class="r">${r[1]+h}</td></tr>`;
      }).join('') + `</table></div>`;
  }
  body += `<div class="sect">MONEY</div><div class="card">
    <div class="cmeta">COLLECTED TO DATE: <b style="color:var(--cream)">${fmtMoney(collected)}</b> &nbsp;·&nbsp;
    PROJECTED POOL: <b style="color:var(--cream)">${fmtMoney(pool)}</b> (${p.split}% OF FEES)</div>
    <table style="margin-top:10px"><tr><th>PLACE</th><th class="r">SHARE</th><th class="r">PAYS</th></tr>` +
    p.payout.map((v,k)=>`<tr><td>${k+1}${['ST','ND','RD'][k]||'TH'}</td><td class="r">${v}%</td><td class="r">${fmtMoney(pool*v/100)}</td></tr>`).join('') +
    `</table></div>`;
  document.getElementById('view-manage').innerHTML = body;
  show('manage');
}
renderDash();
</script>
</body>
</html>
