  :root{--navy:#0D1120;--panel:#131A30;--panel2:#0F1526;--line:#232A44;--cream:#EFE2C4;--dim:#8A93B8;--orange:#F5823E;--hot:#FF8A50}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--cream);font-family:'Dux Stripe Solid',ui-sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.04em}
  main{max-width:640px;margin:0 auto;padding:18px 12px 48px}
  header{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}
  header svg.mark{height:26px;width:auto}
  .ttl{margin-left:auto;text-align:right;font-size:11px;letter-spacing:.2em;color:var(--dim);line-height:1.6}
  .cab{border:1px solid var(--line);border-radius:20px;background:#FFFFFF;padding:20px 16px 16px;text-align:center}
  #stage svg{display:block;width:216px;height:auto;margin:0 auto;image-rendering:pixelated}
  #pname{margin-top:8px;font-family:'Dux Stripe',sans-serif;font-size:30px;color:var(--orange);letter-spacing:.02em}
  .scales{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin-top:12px}
  .scales svg{image-rendering:pixelated}
  .scales .sl{color:#9AA0B4;font-size:8px;letter-spacing:.16em;margin-top:6px}
  .namerow{margin-top:12px}
  input[type=text]{width:100%;font-family:'Dux Stripe Solid';font-size:15px;letter-spacing:.1em;color:var(--cream);
     background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;text-transform:uppercase;text-align:center}
  input[type=text]:focus{border-color:#6B3A1E}
  .group{font-size:9px;letter-spacing:.3em;color:#5A6488;margin:24px 0 0;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sect{font-size:9.5px;letter-spacing:.24em;color:var(--dim);margin:14px 0 8px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:10.5px;letter-spacing:.1em;color:var(--cream);background:var(--panel);border:1px solid var(--line);
        border-radius:999px;padding:9px 13px;cursor:pointer}
  .chip.on{color:var(--orange);border-color:#6B3A1E;background:#1A1426}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
  .sw.on{border-color:var(--orange);box-shadow:0 0 0 2px #6B3A1E}
  .actions{display:flex;gap:8px;margin-top:24px}
  button{flex:1;font-family:'Dux Stripe Solid';font-size:12.5px;letter-spacing:.14em;color:var(--cream);background:var(--panel);
     border:1px solid var(--line);border-radius:12px;padding:14px 8px;cursor:pointer}
  button:active{background:#1A2240}
  button.primary{color:#1A0F06;background:var(--orange);border-color:var(--orange)}
  button.primary:active{background:var(--hot)}
  .note{color:var(--dim);font-size:9.5px;letter-spacing:.14em;text-align:center;margin-top:12px;line-height:1.8;word-break:break-all}
</style>
</head>
