  :root{--navy:#0D1120;--panel:#131A30;--line:#232A44;--cream:#EFE2C4;--dim:#8A93B8;--orange:#F5823E;--hot:#FF8A50}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--cream);font-family:'Dux Stripe Solid',ui-sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:14px 12px 40px}
  .hero{border:1px solid var(--line);border-radius:22px;padding:34px 20px 22px;
        background:radial-gradient(ellipse at 50% 20%, #131A33 0%, #0D1120 70%);text-align:center;cursor:pointer}
  .hero svg{width:100%;max-width:300px;height:auto}
  .selecthdr{margin-top:10px;color:var(--dim);font-size:11px;letter-spacing:.34em}
  .grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 14px 12px;cursor:pointer;position:relative}
  .tile.sel{border-color:#6B3A1E;background:#171223}
  .tile .ic{height:34px;margin-bottom:10px;display:flex;align-items:center}
  .tile .nm{font-size:15px;letter-spacing:.1em;line-height:1.2}
  .tile.sel .nm{color:var(--orange)}
  .tile .tg{color:var(--dim);font-size:10px;letter-spacing:.1em;margin-top:5px;line-height:1.5}
  .tile.soon{opacity:.45;cursor:default}
  .detail{margin-top:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #dname{font-family:'Dux Stripe',sans-serif;font-size:clamp(30px,7vw,40px);color:var(--orange);line-height:1;flex:1;min-width:180px}
  .dmeta{color:var(--dim);font-size:11px;letter-spacing:.14em;line-height:1.7}
  a.launch{font-family:'Dux Stripe Solid';font-size:13px;letter-spacing:.16em;color:#1A0F06;background:var(--orange);
           border-radius:12px;padding:15px 24px;text-decoration:none;flex:none}
  a.launch:active{background:var(--hot)}
  .foot{margin-top:16px;display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.2em}
  .foot .ln{font-family:'Dux Stripe',sans-serif;font-size:28px;color:var(--orange);letter-spacing:0}
  .lt{opacity:.1;filter:drop-shadow(0 0 4px rgba(255,150,95,.9)) drop-shadow(0 0 14px rgba(232,116,59,.55));animation:dxnFlick .95s linear forwards}
  .lt-d{animation-delay:.35s}.lt-u{animation-delay:1.15s}.lt-x{animation-delay:1.95s}
  .bw{opacity:.1;filter:drop-shadow(0 0 3px rgba(239,226,196,.85)) drop-shadow(0 0 10px rgba(239,226,196,.35));animation:dxnFade 1.1s ease-out forwards;animation-delay:2.9s}
  @keyframes dxnFlick{0%{opacity:.1}9%{opacity:1}15%{opacity:.16}23%{opacity:1}30%{opacity:.32}44%{opacity:1}58%{opacity:.85}100%{opacity:1}}
  @keyframes dxnFade{0%{opacity:.1}30%{opacity:.85}45%{opacity:.55}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.lt,.bw{animation:none;opacity:1}}
</style>

<script>
const O = "#F5823E", C = "#EFE2C4", D2 = "#8A93B8";
const ICONS = {
  duckpin: `<svg width="40" height="34" viewBox="0 0 40 34"><g fill="${C}"><circle cx="8" cy="6" r="3"/><circle cx="20" cy="6" r="3"/><circle cx="32" cy="6" r="3"/><circle cx="14" cy="16" r="3"/><circle cx="26" cy="16" r="3"/><circle cx="20" cy="26" r="3" fill="${O}"/></g></svg>`,
  spare: `<svg width="52" height="30" viewBox="0 0 52 30"><g font-family="Dux Stripe" font-size="15" text-anchor="middle"><rect x="1" y="2" width="22" height="26" rx="5" fill="#1A1426" stroke="#6B3A1E"/><text x="12" y="21" fill="${O}">S</text><rect x="28" y="2" width="22" height="26" rx="5" fill="none" stroke="#232A44"/><text x="39" y="21" fill="#232A44">P</text></g></svg>`,
  derby: `<svg width="56" height="26" viewBox="0 0 56 26"><g font-family="Dux Stripe" font-size="14" text-anchor="middle"><rect x="1" y="1" width="16" height="24" rx="4" fill="#1A1426" stroke="#6B3A1E"/><text x="9" y="18" fill="${O}">X</text><rect x="20" y="1" width="16" height="24" rx="4" fill="none" stroke="#232A44"/><text x="28" y="18" fill="${D2}">7</text><rect x="39" y="1" width="16" height="24" rx="4" fill="#1A1426" stroke="#6B3A1E"/><text x="47" y="18" fill="${O}">X</text></g></svg>`,
  hunt: `<svg width="36" height="30" viewBox="0 0 12 10" shape-rendering="crispEdges">${[
    "....cccc....","...cccccc...","...cuccccooo","...cccccooo.","....cccc....",
    ".cccccccc...","cccccccccc..","cccccccccc..",".cccccccc...","...oo..oo..."
  ].map((r,y)=>[...r].map((ch,x)=>ch==="."?"":`<rect x="${x}" y="${y}" width="1" height="1" fill="${ch==="c"?C:ch==="o"?O:"#3A2A1C"}"/>`).join("")).join("")}</svg>`,
  duxtan: `<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5" fill="#2E6B45" stroke="#0D1120" stroke-width="2"/><circle cx="17" cy="17" r="7" fill="${C}"/><text x="17" y="21" text-anchor="middle" font-family="Dux Stripe Solid" font-size="10" fill="#B84A10">8</text></svg>`,
  duxopoly: `<svg width="34" height="34" viewBox="0 0 34 34"><rect x="1" y="1" width="32" height="32" rx="4" fill="none" stroke="#232A44" stroke-width="2"/><rect x="1" y="1" width="32" height="7" fill="#D9482B"/><rect x="1" y="26" width="32" height="7" fill="#4A6FD9"/><circle cx="17" cy="17" r="4" fill="${O}"/></svg>`,
  practice: `<svg width="30" height="34" viewBox="0 0 30 34"><g fill="${C}"><circle cx="15" cy="24" r="7.5"/><rect x="11.5" y="7" width="7" height="12" rx="3.4"/><circle cx="15" cy="7" r="4.6"/></g><circle cx="15" cy="18" r="13" fill="none" stroke="${O}" stroke-width="1.6" stroke-dasharray="3 4"/></svg>`,
  soon: `<svg width="34" height="34" viewBox="0 0 34 34"><rect x="2" y="2" width="30" height="30" rx="8" fill="none" stroke="#232A44" stroke-width="2" stroke-dasharray="4 4"/><text x="17" y="22" text-anchor="middle" font-family="Dux Stripe Solid" font-size="14" fill="#232A44">?</text></svg>`,
};
const GAMES = [
 {id:"duckpin", nm:"DUCKPIN", tg:"3 BALLS A FRAME - CLASSIC SCORING", meta:"1-6 BOWLERS · 10 FRAMES · THE REAL THING", href:"dux-lane-display.html"},
 {id:"spare", nm:"SPARE", tg:"CALL YOUR RACK - MISS AND TAKE A LETTER", meta:"2-6 BOWLERS · ELIMINATION · LAST DUCK STANDING", href:"dux-spare-mode.html"},
 {id:"derby", nm:"STRIKE DERBY", tg:"10 ROLLS - MOST STRIKES WINS", meta:"1-6 BOWLERS · BONUS ROLLS · SUDDEN DEATH", href:"dux-strike-derby.html"},
 {id:"hunt", nm:"DUX HUNT", tg:"RANDOM PINS - BEAT THE BAR", meta:"1 BOWLER · RISING ROUNDS · CHASE THE TOP SCORE", href:"dux-hunt.html"},
 {id:"duxtan", nm:"DUXTAN", tg:"BOWLING DICE - SETTLE THE ISLAND", meta:"3-4 BOWLERS · BUILD AND TRADE · FIRST TO 8", href:"dux-duxtan.html"},
 {id:"duxopoly", nm:"DUXOPOLY", tg:"BUY THE BOARD - LAST DUCK SOLVENT", meta:"2-4 BOWLERS · DEALS AND DOUBLES · SHORT GAME", href:"dux-duxopoly.html"},
 {id:"practice", nm:"PRACTICE", tg:"ANY RACK - AS MANY TIMES AS YOU WANT", meta:"1 BOWLER · NO SCORING · EVERY SPLIT ON DEMAND", href:"dux-practice.html"},
 {id:"soon", nm:"COMING SOON", tg:"NEW GAMES DROP EVERY SEASON", meta:"", href:null},
];
let sel = 0;
document.getElementById('grid').innerHTML = GAMES.map((g, k) =>
  `<div class="tile${g.href ? '' : ' soon'}" id="t${k}" onclick="pick(${k})">` +
  `<div class="ic">${ICONS[g.id]}</div><div class="nm">${g.nm}</div><div class="tg">${g.tg}</div></div>`).join('');
function pick(k) {
  if (!GAMES[k].href) return;
  sel = k;
  GAMES.forEach((g, j) => {
    document.getElementById('t' + j).className = 'tile' + (j === sel ? ' sel' : '') + (g.href ? '' : ' soon');
  });
  document.getElementById('dname').textContent = GAMES[k].nm;
  document.getElementById('dmeta').textContent = GAMES[k].meta;
  document.getElementById('launch').href = GAMES[k].href;
}
function replay() {
  const stage = document.getElementById('stage');
  const svg = stage.querySelector('svg');
  stage.replaceChild(svg.cloneNode(true), svg);
}
pick(0);
</script>
