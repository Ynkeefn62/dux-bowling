  :root{--navy:#0D1120;--panel:#131A30;--line:#232A44;--cream:#EFE2C4;--dim:#8A93B8;--orange:#F5823E;--hot:#FF8A50}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--cream);font-family:'Dux Stripe Solid',ui-sans-serif,system-ui;-webkit-font-smoothing:antialiased;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:18px 12px 40px}
  header{display:flex;align-items:center;gap:14px;padding:4px 2px 14px}
  header svg.mark{height:30px;width:auto}
  .lane{font-family:'Dux Stripe',sans-serif;font-size:30px;color:var(--orange);line-height:1}
  .mode{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.22em;text-align:right;line-height:1.5}
  .msgbar{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:16px;min-height:104px}
  .msgwrap{flex:1;min-width:0}
  #msg{font-family:'Dux Stripe',sans-serif;font-size:clamp(28px,5vw,36px);line-height:1.05}
  #msg.make,#msg.win,#msg.out{color:var(--hot)}
  #msg.letter{color:var(--hot)}
  #msg.safe,#msg.roll{color:var(--dim)}
  #msg.call{color:var(--cream)}
  #chline{margin-top:8px;color:var(--dim);font-size:10.5px;letter-spacing:.2em;min-height:14px}
  #deck{width:118px;flex:none}
  .pin{fill:var(--cream);transition:opacity .25s}
  .pin.down{opacity:.13}
  .pin.ghost{opacity:.06}
  .pin.fell{fill:var(--orange);animation:drop .5s ease-out}
  @keyframes drop{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .board{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:10px}
  .prow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .pname{width:78px;font-size:13px;letter-spacing:.1em}
  .prow.active .pname{color:var(--orange)}
  .prow.dead{opacity:.42}
  .prow.champ .pname{color:var(--hot)}
  .tiles{display:flex;gap:6px;flex:1}
  .tile{width:40px;height:42px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;
        font-family:'Dux Stripe',sans-serif;font-size:28px;color:var(--line)}
  .tile.hit{color:var(--hot);border-color:#6B3A1E;background:#1A1426}
  .tag{width:64px;text-align:right;font-size:10px;letter-spacing:.18em;color:var(--dim)}
  .prow.champ .tag{color:var(--hot)}
  .legend{color:var(--dim);font-size:10px;letter-spacing:.16em;text-align:center;padding:12px 0 2px}
  .sim{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sim b{color:var(--dim);font-size:10px;letter-spacing:.22em;font-weight:400;margin-right:auto}
  button{font-family:'Dux Stripe Solid';font-size:12px;letter-spacing:.12em;color:var(--cream);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
  button:active{background:#1A2240}
  button.primary{color:var(--orange);border-color:#6B3A1E}
  #prog{color:var(--dim);font-size:11px;letter-spacing:.14em;width:100%;text-align:right}
</style>
</head>

<main>
  <header>

const WORD = D.word;
const PINPOS = {1:[65,98],2:[48,70],3:[82,70],4:[31,42],5:[65,42],6:[99,42],7:[14,14],8:[48,14],9:[82,14],10:[116,14]};
const pinsG = document.getElementById('pins');
for (let p = 1; p <= 10; p++) {
  const [x, y] = PINPOS[p];
  pinsG.innerHTML += `<g id="pin${p}" class="pin"><circle cx="${x}" cy="${y+3}" r="7.5"/><rect x="${x-3.5}" y="${y-7}" width="7" height="11" rx="3.4"/><circle cx="${x}" cy="${y-7}" r="4.6"/></g>`;
}
const board = document.getElementById('board');
board.innerHTML = D.bowlers.map((b, bi) =>
  `<div class="prow" id="p${bi}"><div class="pname">${b}</div><div class="tiles">` +
  WORD.split('').map((L, li) => `<div class="tile" id="t${bi}-${li}">${L}</div>`).join('') +
  `</div><div class="tag" id="g${bi}"></div></div>`).join('');

let i = 0, timer = null;
const N = D.events.length;

function render() {
  const ev = i > 0 ? D.events[i-1] : null;
  const msg = document.getElementById('msg');
  msg.textContent = ev ? ev.msg : 'DAVY HAS FIRST CALL';
  msg.className = ev ? ev.kind : 'call';
  const ch = ev && ev.ch;
  document.getElementById('chline').textContent = ch
    ? `CHALLENGE: ${ch.nm} · ${ch.balls} BALL${ch.balls > 1 ? 'S' : ''} · SET BY ${D.bowlers[["DAVY","ANDREW","TERRY","TODD"].indexOf(ch.by)] || ch.by}`
    : '';
  for (let p = 1; p <= 10; p++) {
    const el = document.getElementById('pin' + p);
    let cls = 'pin';
    if (!ev || !ch) cls = 'pin';
    else if (ev.fell.includes(p)) cls = 'pin fell';
    else if (ev.standing.includes(p)) cls = 'pin';
    else if (ch.pins.includes(p)) cls = 'pin down';
    else cls = 'pin ghost';
    el.setAttribute('class', cls);
  }
  D.bowlers.forEach((b, bi) => {
    const row = document.getElementById('p' + bi);
    const letters = ev ? ev.letters[bi] : '';
    const dead = ev ? ev.out[bi] : false;
    const champ = ev && ev.kind === 'win' && ev.act === bi;
    row.className = 'prow' + (dead ? ' dead' : '') + (champ ? ' champ' : '') +
      (ev && ev.act === bi && !champ && ev.kind !== 'win' ? ' active' : '');
    WORD.split('').forEach((L, li) => {
      document.getElementById(`t${bi}-${li}`).className = 'tile' + (li < letters.length ? ' hit' : '');
    });
    document.getElementById('g' + bi).textContent = champ ? 'WINNER' : (dead ? 'OUT' : '');
  });
  document.getElementById('prog').textContent =
    i === 0 ? 'READY' : (D.events[i-1].kind === 'win' ? 'GAME OVER' : `STEP ${i} / ${N-1}`);
}
function step(d) { i = Math.max(0, Math.min(N, i + d)); render(); if (i >= N) stop(); }
function go(n) { i = n; stop(); render(); }
function stop() { if (timer) clearInterval(timer); timer = null; document.getElementById('play').textContent = 'PLAY'; }
function toggle() {
  if (timer) return stop();
  if (i >= N) i = 0;
  document.getElementById('play').textContent = 'PAUSE';
  timer = setInterval(() => { i++; if (i >= N) { render(); stop(); } else render(); }, 1050);
}
render();
