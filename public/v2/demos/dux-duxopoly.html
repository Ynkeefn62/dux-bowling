  :root{--navy:#0D1120;--panel:#131A30;--line:#232A44;--cream:#EFE2C4;--dim:#8A93B8;--orange:#F5823E;--hot:#FF8A50}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--cream);font-family:'Dux Stripe Solid',ui-sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:18px 12px 40px}
  header{display:flex;align-items:center;gap:14px;padding:4px 2px 14px}
  header svg.mark{height:30px;width:auto}
  .lane{font-family:'Dux Stripe',sans-serif;font-size:30px;color:var(--orange);line-height:1}
  .mode{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.22em;text-align:right;line-height:1.5}
  .msgbar{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:92px}
  .msgwrap{flex:1;min-width:0}
  #msg{font-family:'Dux Stripe',sans-serif;font-size:clamp(28px,4.4vw,31px);line-height:1.06}
  #msg.rent,#msg.bust,#msg.win,#msg.goto{color:var(--hot)}
  #msg.buy,#msg.build,#msg.deal{color:var(--orange)}
  #msg.move,#msg.card,#msg.payx{color:var(--dim)}
  #msg.die,#msg.start{color:var(--cream)}
  .dice{display:flex;gap:8px;flex:none}
  .die{width:50px;height:56px;border:1px solid var(--line);border-radius:12px;background:#0F1526;
       display:flex;align-items:center;justify-content:center;font-family:'Dux Stripe',sans-serif;font-size:30px;color:var(--orange)}
  #deck{width:92px;flex:none}
  .pin{fill:var(--cream);transition:opacity .2s}
  .pin.down{opacity:.14}.pin.ghost{opacity:.05}
  .pin.fell{fill:var(--orange);animation:drop .45s ease-out}
  @keyframes drop{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .boardwrap{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:8px}
  #board{display:block;width:100%;height:auto}
  .players{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:8px}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .pname{width:66px;font-size:12px;letter-spacing:.08em;flex:none}
  .prow.active .pname{color:var(--orange)}
  .prow.champ .pname,.prow.champ .cash{color:var(--hot)}
  .prow.dead{opacity:.35;text-decoration:line-through}
  .cash{width:76px;font-size:16px;flex:none}
  .deeds{color:var(--dim);font-size:11px;flex:1}
  .tag{width:66px;text-align:right;font-size:9.5px;letter-spacing:.16em;color:var(--orange)}
  .legend{color:var(--dim);font-size:10px;letter-spacing:.13em;text-align:center;padding:10px 0 2px}
  .sim{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sim b{color:var(--dim);font-size:10px;letter-spacing:.22em;font-weight:400;margin-right:auto}
  button{font-family:'Dux Stripe Solid';font-size:12px;letter-spacing:.12em;color:var(--cream);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
  button:active{background:#1A2240}
  button.primary{color:var(--orange);border-color:#6B3A1E}

  if (i === 0)  return {x: 330-C, y: 330-C, w: C, h: C, side: null};
  if (i < 10)   return {x: 330-C-i*E, y: 330-C, w: E, h: C, side: "top"};

function step(d) { i = Math.max(0, Math.min(N, i + d)); render(); if (i >= N) stop(); }
function go(n) { i = n; stop(); render(); }
function stop() { if (timer) clearInterval(timer); timer = null; document.getElementById('play').textContent = 'PLAY'; }
function toggle() {
  if (timer) return stop();
  if (i >= N) i = 0;
  document.getElementById('play').textContent = 'PAUSE';
  timer = setInterval(() => { i++; if (i >= N) { render(); stop(); } else render(); }, 1000);
}
